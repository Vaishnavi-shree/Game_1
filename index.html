<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wonder 3D Racing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#050914;font-family:Arial,sans-serif}
canvas{display:block}
#loading{
 position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,#12314c,#030712 70%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;
}
#loading h1{font-size:clamp(27px,6vw,55px);font-weight:900;letter-spacing:5px;color:#45e8ff;text-shadow:0 0 25px #00bfff}
#loadingCar{font-size:90px;margin:30px 0;filter:drop-shadow(0 0 22px #00dfff);animation:carMove 1s infinite alternate}
@keyframes carMove{from{transform:translateX(-35px) rotate(-3deg)}to{transform:translateX(35px) rotate(3deg)}}
#loadingTrack{width:min(75%,420px);height:9px;border-radius:20px;background:#24364a;overflow:hidden}
#loadingBar{height:100%;width:0;background:linear-gradient(90deg,#00aaff,#55ffff);box-shadow:0 0 15px #00dfff}
#loadingPercent{margin-top:12px;font-size:20px;color:#66eaff}
#loadingText{margin-top:12px;color:#b4cbdc;font-size:13px;letter-spacing:2px}
#hud{position:fixed;top:15px;left:15px;z-index:5;color:white;pointer-events:none}
.panel{background:#071426dc;border:1px solid #19cfff66;border-radius:12px;padding:12px 16px;margin-bottom:9px;backdrop-filter:blur(8px)}
#speed{font-size:30px;font-weight:900;color:#35eaff}
#status{font-size:11px;color:#a9ddeb;margin-top:5px}
#help{position:fixed;top:15px;right:15px;z-index:5;color:white;background:#071426dd;padding:12px;border-radius:12px;font-size:11px;line-height:1.8}
#message{position:fixed;top:42%;width:100%;text-align:center;color:#fff;font-size:26px;font-weight:bold;text-shadow:0 0 15px #00cfff;pointer-events:none;z-index:4;opacity:0}
#musicBtn{position:fixed;top:155px;right:15px;z-index:8;background:#09283a;color:white;border:1px solid #00cfff;border-radius:10px;padding:11px;cursor:pointer}
#controls{position:fixed;bottom:20px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 18px;z-index:6;pointer-events:none}
.group{display:flex;gap:9px;pointer-events:auto}
.control{width:58px;height:58px;border-radius:15px;border:1px solid #44dfff;background:#071b2ddd;color:white;font-size:23px;font-weight:bold;touch-action:none;user-select:none}
.control:active{background:#008fba}
#rightControls .control{width:58px}
#gameUI{display:none}
@media(min-width:850px){#controls{opacity:.55}}
@media(max-width:600px){
 #help{font-size:9px;padding:8px}
 #musicBtn{top:145px}
 .control{width:49px;height:49px}
 #rightControls .control{width:49px}
}
</style>
</head>
<body>

<div id="loading">
 <h1>WONDER RACING</h1>
 <div id="loadingCar">🏎️</div>
 <div id="loadingTrack"><div id="loadingBar"></div></div>
 <div id="loadingPercent">0%</div>
 <div id="loadingText">INITIALIZING RACING ENGINE...</div>
</div>

<div id="gameUI">
 <div id="hud">
  <div class="panel">
   <div style="font-size:11px;color:#8bdff5">WONDER RACING</div>
   <div id="speed">000 <span style="font-size:12px">KM/H</span></div>
   <div id="status">READY TO RACE</div>
  </div>
  <div class="panel">
   SCORE: <span id="score">0</span><br>
   LAP: <span id="lap">1</span>/3<br>COINS: <span id="wallet">0</span> · LEVEL: <span id="level">1</span><br>
   DISTANCE: <span id="distance">0</span> m<br>
   NITRO: <span id="nitro">100</span>%
  </div>
 </div>

 <div id="help">
  W / ↑ ACCELERATE<br>
  S / ↓ BRAKE<br>
  A / ← LEFT<br>
  D / → RIGHT<br>
  SPACE JUMP<br>
  SHIFT NITRO
 </div>

 <button id="musicBtn">♫ MUSIC: OFF</button>
 <div id="message"></div>

 <div id="controls">
  <div class="group">
   <button class="control" data-key="left">◀</button>
   <button class="control" data-key="right">▶</button>
  </div>
  <div class="group" id="rightControls">
   <button class="control" data-key="brake">▼</button>
   <button class="control" data-key="jump">⬆</button>
   <button class="control" data-key="nitro">⚡</button>
   <button class="control" data-key="accelerate">▲</button>
  </div>
 </div>
</div>

<div id="careerOverlay" class="career-overlay">
 <div class="career-card">
  <h1>🏎️ WONDER CAR</h1>
  <p id="careerSubtitle">Rise of the Legend · Hard Mode · 3 Laps</p>
  <div id="careerStats"></div>
  <div id="careerContent"></div>
  <div class="career-buttons">
   <button id="playRace">▶ PLAY RACE</button>
   <button id="garageBtn">🚘 GARAGE</button>
   <button id="missionsBtn">🎯 MISSIONS</button>
   <button id="achieveBtn">🏆 ACHIEVEMENTS</button>
  </div>
 </div>
</div>

<style>
.career-overlay{position:fixed;inset:0;z-index:30;background:linear-gradient(135deg,#020816ed,#091e39ed);display:none;align-items:center;justify-content:center;padding:16px;color:white;font-family:Arial,sans-serif}
.career-card{width:min(660px,100%);max-height:92vh;overflow:auto;background:#071629;border:1px solid #24cafa88;border-radius:20px;padding:22px;box-shadow:0 0 45px #0085c033;text-align:center}
.career-card h1{color:#52e6ff;margin:0 0 9px}
.career-card p{color:#b7d9e5}
.career-buttons{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:15px}
.career-buttons button,.career-buy{background:#0c3952;color:white;border:1px solid #39dafa;border-radius:9px;padding:12px;cursor:pointer;font-weight:bold}
.career-buttons button:hover,.career-buy:hover{background:#176789}
.career-buy:disabled{opacity:.45;cursor:not-allowed}
.career-row{background:#10243b;border:1px solid #1d4560;border-radius:11px;padding:12px;margin:9px 0;text-align:left}
.career-row small{color:#b4d1e2}
.career-row strong{color:#5ce6ff}
.career-badge{color:#ffdc75}
</style>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ================ 10 SECOND LOADING ================
const loadingMessages=[
 'INITIALIZING RACING ENGINE...',
 'LOADING 3D RACING CAR...',
 'BUILDING NAVIRA CITY TRACK...',
 'PLACING ROAD OBSTACLES...',
 'ACTIVATING JUMP PHYSICS...',
 'PREPARING NITRO SYSTEM...',
 'LOADING RACING AUDIO...',
 'CHECKING CONTROLS...',
 'FINALIZING GAME WORLD...',
 'READY TO RACE!'
];

const loadingStart=performance.now();

function updateLoading(){
 const elapsed=(performance.now()-loadingStart)/1000;
 const progress=Math.min(1,elapsed/10);

 document.getElementById('loadingBar').style.width=(progress*100)+'%';
 document.getElementById('loadingPercent').textContent=Math.floor(progress*100)+'%';

 const index=Math.min(9,Math.floor(progress*10));
 document.getElementById('loadingText').textContent=loadingMessages[index];

 if(progress<1){
  requestAnimationFrame(updateLoading);
 }else{
  document.getElementById('loading').style.transition='opacity .8s';
  document.getElementById('loading').style.opacity='0';

  setTimeout(()=>{
   document.getElementById('loading').style.display='none';
   document.getElementById('gameUI').style.display='block';
   document.getElementById('message').textContent='GO! GO! GO!';
   document.getElementById('message').style.opacity='1';
   setTimeout(()=>document.getElementById('message').style.opacity='0',1800);
   document.getElementById('careerOverlay').style.display='flex';
   startGame();
  },800);
 }
}

updateLoading();

// ================ GAME START FUNCTION ================
function startGame(){
    // ================ THREE.JS SCENE ================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07111e);
scene.fog=new THREE.Fog(0x07111e,110,400);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
camera.position.set(0,7,-14);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

// ================ LIGHTING ================
scene.add(new THREE.HemisphereLight(0xaaddff,0x18202d,2));

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-30,60,-20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const neonLight=new THREE.PointLight(0x00cfff,70,70);
neonLight.position.set(0,8,0);
scene.add(neonLight);

// ================ GROUND ================
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1000,1000),
 new THREE.MeshStandardMaterial({color:0x101b20,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.2;
ground.receiveShadow=true;
scene.add(ground);

// ================ RACING TRACK ================
const TRACK_A=75,TRACK_B=48,ROAD_WIDTH=18,SEGMENTS=360;
const trackPoints=[];

for(let i=0;i<SEGMENTS;i++){
 const t=i/SEGMENTS*Math.PI*2;
 trackPoints.push(new THREE.Vector3(
  Math.cos(t)*TRACK_A,0,Math.sin(t)*TRACK_B
 ));
}

function trackPosition(t,offset=0){
 const a=t*Math.PI*2;

 const p=new THREE.Vector3(
  Math.cos(a)*TRACK_A,0,Math.sin(a)*TRACK_B
 );

 const tangent=new THREE.Vector3(
  -Math.sin(a)*TRACK_A,0,Math.cos(a)*TRACK_B
 ).normalize();

 const side=new THREE.Vector3(-tangent.z,0,tangent.x);
 p.addScaledVector(side,offset);

 return {position:p,tangent,side};
}

// Road surface
const vertices=[],indices=[];

for(let i=0;i<=SEGMENTS;i++){
 const p=trackPoints[i%SEGMENTS];
 const next=trackPoints[(i+1)%SEGMENTS];

 const tangent=new THREE.Vector3().subVectors(next,p).normalize();
 const side=new THREE.Vector3(-tangent.z,0,tangent.x);

 const left=p.clone().addScaledVector(side,ROAD_WIDTH/2);
 const right=p.clone().addScaledVector(side,-ROAD_WIDTH/2);

 vertices.push(left.x,.02,left.z,right.x,.02,right.z);

 if(i<SEGMENTS){
  const n=i*2;
  indices.push(n,n+1,n+2,n+1,n+3,n+2);
 }
}

const roadGeo=new THREE.BufferGeometry();
roadGeo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
roadGeo.setIndex(indices);
roadGeo.computeVertexNormals();

const road=new THREE.Mesh(roadGeo,new THREE.MeshStandardMaterial({
 color:0x252c35,roughness:.85,side:THREE.DoubleSide
}));

road.receiveShadow=true;
scene.add(road);

// Road borders
for(const side of [-1,1]){
 const points=[];

 for(let i=0;i<=SEGMENTS;i++){
  points.push(trackPosition(i/SEGMENTS,side*(ROAD_WIDTH/2+.8)).position);
 }

 const curve=new THREE.CatmullRomCurve3(points,true);

 const barrier=new THREE.Mesh(
  new THREE.TubeGeometry(curve,SEGMENTS*2,.5,8,true),
  new THREE.MeshStandardMaterial({
   color:side===1?0x00cfff:0xff315c,
   emissive:side===1?0x004b77:0x660015,
   emissiveIntensity:1.5
  })
 );

 barrier.position.y=.55;
 scene.add(barrier);
}

// Center lane markings
for(let i=0;i<SEGMENTS;i+=5){
 const p=trackPoints[i],next=trackPoints[(i+1)%SEGMENTS];

 const dash=new THREE.Mesh(
  new THREE.BoxGeometry(.25,.04,2.1),
  new THREE.MeshStandardMaterial({color:0xdffaff})
 );

 dash.position.set(p.x,.07,p.z);
 dash.rotation.y=Math.atan2(next.x-p.x,next.z-p.z);
 scene.add(dash);
}

// ================ CITY BUILDINGS ================
const buildingMat=new THREE.MeshStandardMaterial({
 color:0x17283c,metalness:.3,roughness:.7
});

for(let i=0;i<65;i++){
 const a=Math.random()*Math.PI*2;
 const r=100+Math.random()*65;
 const h=9+Math.random()*35;

 const building=new THREE.Mesh(
  new THREE.BoxGeometry(7+Math.random()*10,h,7+Math.random()*10),
  buildingMat
 );

 building.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);
 building.castShadow=true;
 scene.add(building);
}

// Street lights
for(let i=0;i<48;i++){
 const p=trackPosition(i/48,ROAD_WIDTH/2+4);
 const pole=new THREE.Group();

 const post=new THREE.Mesh(
  new THREE.CylinderGeometry(.12,.16,5,8),
  new THREE.MeshStandardMaterial({color:0x38475b})
 );

 post.position.y=2.5;
 pole.add(post);

 const bulb=new THREE.Mesh(
  new THREE.SphereGeometry(.3,8,8),
  new THREE.MeshBasicMaterial({color:0x42ddff})
 );

 bulb.position.y=5;
 pole.add(bulb);

 const glow=new THREE.PointLight(0x25bfff,8,18);
 glow.position.y=4.7;
 pole.add(glow);

 pole.position.copy(p.position);
 scene.add(pole);
}
// ================ PLAYER CAR ================
const car=new THREE.Group();

const carBodyMat=new THREE.MeshStandardMaterial({
 color:0xe51c42,metalness:.75,roughness:.22
});

const blackMat=new THREE.MeshStandardMaterial({
 color:0x10151d,metalness:.5,roughness:.35
});

const glassMat=new THREE.MeshPhysicalMaterial({
 color:0x071d2b,metalness:.3,roughness:.1,transparent:true,opacity:.9
});

const body=new THREE.Mesh(
 new THREE.BoxGeometry(2.1,.65,4.2),
 carBodyMat
);
body.position.y=.85;
body.castShadow=true;
car.add(body);

const hood=new THREE.Mesh(
 new THREE.BoxGeometry(1.9,.18,1.1),
 carBodyMat
);
hood.position.set(0,1.2,1.15);
car.add(hood);

const cabin=new THREE.Mesh(
 new THREE.BoxGeometry(1.55,.85,1.8),
 glassMat
);
cabin.position.set(0,1.5,-.15);
car.add(cabin);

const roof=new THREE.Mesh(
 new THREE.BoxGeometry(1.5,.13,1.5),
 blackMat
);
roof.position.set(0,1.95,-.2);
car.add(roof);

// Front bumper
const bumper=new THREE.Mesh(
 new THREE.BoxGeometry(2.15,.25,.3),
 blackMat
);
bumper.position.set(0,.55,2.05);
car.add(bumper);

// Rear spoiler
const spoiler=new THREE.Mesh(
 new THREE.BoxGeometry(2.3,.12,.45),
 blackMat
);
spoiler.position.set(0,1.7,-1.95);
car.add(spoiler);

// Wheels
const wheels=[];

for(const x of [-1.08,1.08]){
 for(const z of [-1.35,1.35]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.43,.43,.32,24),
   new THREE.MeshStandardMaterial({
    color:0x080b10,roughness:.9
   })
  );

  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.5,z);
  wheel.castShadow=true;
  car.add(wheel);
  wheels.push(wheel);

  const rim=new THREE.Mesh(
   new THREE.CylinderGeometry(.22,.22,.34,16),
   new THREE.MeshStandardMaterial({
    color:0x9bc9d8,metalness:.9,roughness:.2
   })
  );

  rim.rotation.z=Math.PI/2;
  rim.position.set(x,.5,z);
  car.add(rim);
 }
}

// Headlights
for(const x of [-.7,.7]){
 const light=new THREE.Mesh(
  new THREE.BoxGeometry(.42,.18,.08),
  new THREE.MeshBasicMaterial({color:0x9ef5ff})
 );

 light.position.set(x,1.05,2.12);
 car.add(light);

 const beam=new THREE.SpotLight(0x9eeeff,30,50,Math.PI/7,.5,1);
 beam.position.set(x,1.2,2.1);
 beam.target.position.set(x,.2,18);
 car.add(beam);
 car.add(beam.target);
}

// Nitro exhaust
for(const x of [-.65,.65]){
 const exhaust=new THREE.Mesh(
  new THREE.CylinderGeometry(.15,.21,.45,12),
  new THREE.MeshStandardMaterial({
   color:0x333d48,metalness:.8
  })
 );

 exhaust.rotation.x=Math.PI/2;
 exhaust.position.set(x,.65,-2.2);
 car.add(exhaust);
}

scene.add(car);

// ================ CAR COLLECTION ================
const carCollection=[
 {id:"starter",name:"Street Beast",price:0,level:1,color:0xe51c42,description:"Your first racing machine"},
 {id:"blue",name:"Blue Thunder",price:1200,level:3,color:0x168cff,description:"Fast and stylish"},
 {id:"purple",name:"Shadow X",price:3000,level:7,color:0x912cff,description:"Dark racing legend"},
 {id:"green",name:"Venom GT",price:6000,level:12,color:0x16d77a,description:"A powerful beast"},
 {id:"gold",name:"Golden Legend",price:12000,level:20,color:0xffc629,description:"The ultimate legendary car"}
];

function applyCarColor(){
 const selected=carCollection.find(x=>x.id===career.selectedCar);
 if(selected) carBodyMat.color.setHex(selected.color);
}

// ================ RAMPS ================
const ramps=[];

for(let i=0;i<5;i++){
 const p=trackPosition(.12+i*.18,0);

 const ramp=new THREE.Mesh(
  new THREE.BoxGeometry(5,.5,7),
  new THREE.MeshStandardMaterial({
   color:0x00cfff,
   emissive:0x005577,
   emissiveIntensity:1
  })
 );

 ramp.position.copy(p.position);
 ramp.position.y=.35;
 ramp.rotation.y=Math.atan2(p.tangent.x,p.tangent.z);
 scene.add(ramp);
 ramps.push({mesh:ramp,position:p.position.clone(),used:false});
}

// ================ OBSTACLES ================
const obstacles=[];
const obstacleColors=[0xff3157,0xffa323,0xa82dff];

for(let i=0;i<12;i++){
 const p=trackPosition(i/12+.04,(i%2===0)?-3:3);

 const obj=new THREE.Group();

 const block=new THREE.Mesh(
  new THREE.BoxGeometry(2.3,1.6,2),
  new THREE.MeshStandardMaterial({
   color:obstacleColors[i%3],
   emissive:obstacleColors[i%3],
   emissiveIntensity:.3
  })
 );

 block.position.y=.8;
 obj.add(block);
 obj.position.copy(p.position);
 scene.add(obj);

 obstacles.push({
  mesh:obj,
  position:p.position.clone(),
  hit:false
 });
}

// ================ RAIN PARTICLES ================
const rainCount=1400;
const rainPositions=new Float32Array(rainCount*3);

for(let i=0;i<rainCount;i++){
 rainPositions[i*3]=(Math.random()-.5)*180;
 rainPositions[i*3+1]=Math.random()*45;
 rainPositions[i*3+2]=(Math.random()-.5)*180;
}

const rainGeo=new THREE.BufferGeometry();
rainGeo.setAttribute(
 'position',
 new THREE.BufferAttribute(rainPositions,3)
);

const rain=new THREE.Points(
 rainGeo,
 new THREE.PointsMaterial({
  color:0x9fdfff,
  size:.13,
  transparent:true,
  opacity:.6
 })
);

scene.add(rain);
// ================ CAREER SYSTEM ================
const SAVE_KEY="wonder_car_career_v1";

const defaultCareer={
 coins:0,
 xp:0,
 level:1,
 totalRaces:0,
 totalWins:0,
 totalJumps:0,
 totalObstacles:0,
 totalDistance:0,
 cleanRaces:0,
 bestScore:0,
 selectedCar:"starter",
 unlockedCars:["starter"],
 achievements:[],
 missions:{},
 dailyDate:"",
 dailyClaimed:false
};

function loadCareer(){
 try{
  const saved=JSON.parse(localStorage.getItem(SAVE_KEY));
  return {...defaultCareer,...saved};
 }catch(error){
  return {...defaultCareer};
 }
}

let career=loadCareer();

function saveCareer(){
 localStorage.setItem(SAVE_KEY,JSON.stringify(career));
 updateCareerStats();
}

function addCoins(amount){
 career.coins+=Math.max(0,Math.floor(amount));
 saveCareer();
}

function addXP(amount){
 career.xp+=Math.max(0,Math.floor(amount));

 while(career.xp>=career.level*500){
  career.xp-=career.level*500;
  career.level++;
  showMessage("LEVEL UP! LEVEL "+career.level);
 }

 saveCareer();
}

function updateCareerStats(){
 const box=document.getElementById("careerStats");

 if(!box)return;

 box.innerHTML=`
  <div class="career-row">
   <strong>🪙 ${career.coins}</strong> Coins
   &nbsp; | &nbsp;
   <strong>⭐ ${career.xp}</strong> XP
   &nbsp; | &nbsp;
   <strong>LEVEL ${career.level}</strong>
  </div>
  <div class="career-row">
   Total Races: ${career.totalRaces}<br>
   Race Wins: ${career.totalWins}<br>
   Best Score: ${career.bestScore}
  </div>
 `;

 document.getElementById("wallet").textContent=career.coins;
 document.getElementById("level").textContent=career.level;
}

function showMessage(text){
 const el=document.getElementById("message");
 el.textContent=text;
 el.style.opacity="1";

 clearTimeout(showMessage.timer);

 showMessage.timer=setTimeout(()=>{
  el.style.opacity="0";
 },1700);
}

// ================ DAILY LOGIN ================
function checkDailyReward(){
 const today=new Date().toDateString();

 if(career.dailyDate!==today){
  career.dailyDate=today;
  career.dailyClaimed=false;
  saveCareer();
 }

 if(!career.dailyClaimed){
  career.dailyClaimed=true;
  addCoins(50);
  addXP(25);
  showMessage("DAILY REWARD +50 COINS!");
 }
}

// ================ MISSIONS ================
const missionList=[
 {
  id:"race3",
  name:"First Champion",
  description:"Complete 3 races",
  target:3,
  reward:500,
  xp:150
 },
 {
  id:"jump20",
  name:"Sky King",
  description:"Perform 20 jumps",
  target:20,
  reward:400,
  xp:100
 },
 {
  id:"avoid50",
  name:"Obstacle Master",
  description:"Avoid 50 obstacles",
  target:50,
  reward:600,
  xp:150
 },
 {
  id:"distance5000",
  name:"Road Explorer",
  description:"Drive 5000 metres",
  target:5000,
  reward:750,
  xp:200
 },
 {
  id:"clean3",
  name:"Perfect Driver",
  description:"Complete 3 races without crashing",
  target:3,
  reward:1200,
  xp:300
 },
 {
  id:"score10000",
  name:"Score Hunter",
  description:"Reach 10000 score in a race",
  target:10000,
  reward:1000,
  xp:250
 }
];

function missionProgress(id){
 switch(id){
  case "race3":return career.totalRaces;
  case "jump20":return career.totalJumps;
  case "avoid50":return career.totalObstacles;
  case "distance5000":return career.totalDistance;
  case "clean3":return career.cleanRaces;
  case "score10000":return career.bestScore;
  default:return 0;
 }
}

function checkMissions(){
 career.missions=career.missions||{};

 for(const m of missionList){
  if(career.missions[m.id])continue;

  if(missionProgress(m.id)>=m.target){
   career.missions[m.id]=true;
   addCoins(m.reward);
   addXP(m.xp);
   showMessage("MISSION COMPLETE: "+m.name);
  }
 }

 saveCareer();
}

window.selectCareerCar=function(id){

 if(!career.unlockedCars.includes(id)){

   alert("Not enough coins!");
   return;
  }

  if(career.level<c.level){
   alert("Required level not reached!");
   return;
  }

  career.coins-=c.price;
  career.unlockedCars.push(id);
 }

 career.selectedCar=id;
 applyCarColor();
 saveCareer();
 showGarage();
};

document.getElementById("playRace").onclick=()=>{

// ================ RACE STATE ================

const state={
 running:false,
 paused:false,
 over:false,
 finished:false,
 speed:0,
 maxSpeed:190,
 score:0,
 distance:0,
 lap:1,
 nitro:100,
 angle:0,
 trackT:0,
 jumpY:0,
 jumpVelocity:0,
 jumps:0,
 crashes:0,
 obstaclesAvoided:0,
 rampUsed:false,
 cleanRace:true,
 lastDistanceReward:0,
 lastObstacleReward:0,
 raceStartTime:0
};

const keys={
 left:false,
 right:false,
 accelerate:false,
 brake:false,
 nitro:false,
 jump:false
};

let lastTime=performance.now();
let lapDistance=0;
let totalRaceDistance=0;

// ================ SCORE SYSTEM ================

function addPoints(amount,label){
 state.score+=amount;
 document.getElementById("score").textContent=state.score;

 if(label)showMessage(label);

 if(state.score<=-900){
  endRace(false);
 }
}

// ================ RESET RACE ================

function resetRace(){
 state.running=false;
 state.paused=false;
 state.over=false;
 state.finished=false;
 state.speed=0;
 state.score=0;
 state.distance=0;
 state.lap=1;
 state.nitro=100;
 state.angle=0;
 state.trackT=0;
 state.jumpY=0;
 state.jumpVelocity=0;
 state.jumps=0;
 state.crashes=0;
 state.obstaclesAvoided=0;
 state.rampUsed=false;
 state.cleanRace=true;
 state.lastDistanceReward=0;
 state.lastObstacleReward=0;

 lapDistance=0;
 totalRaceDistance=0;

 for(const o of obstacles)o.hit=false;
 for(const r of ramps)r.used=false;

 document.getElementById("score").textContent="0";
 document.getElementById("lap").textContent="1";
 document.getElementById("distance").textContent="0";
 document.getElementById("nitro").textContent="100";

 const start=trackPosition(0,0);
 car.position.set(start.position.x,0,start.position.z);
 car.rotation.y=Math.atan2(start.tangent.x,start.tangent.z);

 camera.position.set(
  car.position.x,
  7,
  car.position.z-14
 );
 camera.lookAt(car.position);
}

// ================ START RACE ================

function startRace(){
 resetRace();

 careerContent.innerHTML="";
 document.getElementById("careerOverlay").style.display="none";
 document.getElementById("gameUI").style.display="block";

 state.running=true;
 state.raceStartTime=performance.now();

 showMessage("3... 2... 1... GO!");
}

// ================ COLLISION ================

function collision(){
 if(state.over||state.finished)return;

 state.crashes++;
 state.cleanRace=false;
 state.speed*=.45;

 addPoints(-100,"CRASH! -100");

 if(state.score>-900){
  showMessage("COLLISION! DRIVE CAREFULLY");
 }
}

// ================ JUMP ================

function performJump(){
 if(state.jumpY>0||state.over||state.finished)return;

 state.jumpVelocity=11;
 state.jumps++;

 career.totalJumps++;
 addPoints(25,"PERFECT JUMP +25");

 checkMissions();
 checkAchievements();
}

// ================ DISTANCE REWARDS ================

function updateDistanceRewards(){
 const current=Math.floor(totalRaceDistance);

 if(current-state.lastDistanceReward>=500){
  state.lastDistanceReward+=500;
  addPoints(10,"DISTANCE BONUS +10");
 }
}

// ================ RAMP DETECTION ================

function checkRamps(){
 for(const r of ramps){
  if(r.used)continue;

  const d=car.position.distanceTo(r.position);

  if(d<5&&state.speed>65){
   r.used=true;
   state.jumpVelocity=12;
   state.jumps++;
   career.totalJumps++;

   addPoints(75,"RAMP JUMP +75");

   checkMissions();
   checkAchievements();
  }
 }
}

// ================ OBSTACLE DETECTION ================

function checkObstacles(){
 for(const o of obstacles){
  const d=car.position.distanceTo(o.position);

  if(d<3.1&&!o.hit){
   o.hit=true;
   collision();
  }

  if(d>8&&d<13&&!o.hit){
   o.hit=true;
   state.obstaclesAvoided++;
   career.totalObstacles++;

   addPoints(150,"OBSTACLE CLEARED +150");

   checkMissions();
   checkAchievements();
  }
 }
}

// ================ LAP DETECTION ================

function checkLap(){
 if(state.trackT>=1){
  state.trackT-=1;
  state.lap++;

  if(state.lap>3){
   endRace(true);
   return;
  }

  document.getElementById("lap").textContent=state.lap;
  addPoints(100,"LAP COMPLETED +100");
 }
}

// ================ RACE END ================

function endRace(won){
 if(state.over||state.finished)return;

 state.running=false;
 state.over=true;
 state.finished=won;

 if(won){
  career.totalRaces++;
  career.totalWins++;

  if(state.cleanRace){
   career.cleanRaces++;
  }

  const raceCoins=300;
  const scoreCoins=Math.max(0,Math.floor(state.score/100));
  const distanceCoins=Math.floor(totalRaceDistance/100);

  const bonus=state.cleanRace?200:0;
  const totalCoins=raceCoins+scoreCoins+distanceCoins+bonus;

  addCoins(totalCoins);
  addXP(200+Math.floor(state.score/10));

  career.bestScore=Math.max(career.bestScore,state.score);
  career.totalDistance+=Math.floor(totalRaceDistance);

  checkMissions();
  checkAchievements();
  saveCareer();

  careerContent.innerHTML=`
   <h2>🏁 RACE COMPLETED!</h2>
   <div class="career-row">
    <strong>3 LAPS COMPLETED</strong><br>
    Score: ${state.score}<br>
    Race Reward: ${raceCoins} coins<br>
    Score Bonus: ${scoreCoins} coins<br>
    Distance Bonus: ${distanceCoins} coins<br>
    Clean Race Bonus: ${bonus} coins<br>
    <h2>🪙 TOTAL: ${totalCoins} COINS</h2>
    ⭐ XP EARNED
   </div>
  `;

 }else{
  careerContent.innerHTML=`
   <h2>💥 GAME OVER</h2>
   <div class="career-row">
    You could not finish all 3 laps.<br>
    Final Score: ${state.score}<br>
    No race completion reward.
   </div>
  `;
 }

 document.getElementById("careerSubtitle").textContent=
  won?"LEGENDARY PERFORMANCE!":"TRY AGAIN, RACER!";

 document.getElementById("careerOverlay").style.display="flex";
 document.getElementById("gameUI").style.display="none";

 const buttons=document.querySelector(".career-buttons");

 buttons.innerHTML=`
  <button id="againBtn">🔄 PLAY AGAIN</button>
  <button id="menuBtn">🏠 MAIN MENU</button>
  <button id="resultGarage">🚘 GARAGE</button>
 `;

 document.getElementById("againBtn").onclick=startRace;

 document.getElementById("menuBtn").onclick=()=>{
  showCareerMenu();
 };

 document.getElementById("resultGarage").onclick=showGarage;

 updateCareerStats();
}
// ================ KEYBOARD CONTROLS ================

const keyMap={
 ArrowLeft:"left",
 KeyA:"left",
 ArrowRight:"right",
 KeyD:"right",
 ArrowUp:"accelerate",
 KeyW:"accelerate",
 ArrowDown:"brake",
 KeyS:"brake",
 Space:"jump",
 ShiftLeft:"nitro",
 ShiftRight:"nitro"
};

window.addEventListener("keydown",e=>{
 const key=keyMap[e.code];

 if(key){
  e.preventDefault();
  keys[key]=true;
 }

 if(e.code==="Escape"&&state.running){
  state.paused=!state.paused;
  showMessage(state.paused?"PAUSED":"RACE RESUMED");
 }
});

window.addEventListener("keyup",e=>{
 const key=keyMap[e.code];
 if(key)keys[key]=false;
});

// ================ MOBILE CONTROLS ================

document.querySelectorAll(".control").forEach(btn=>{
 const key=btn.dataset.key;

 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });

 const release=()=>{
  keys[key]=false;
 };

 btn.addEventListener("pointerup",release);
 btn.addEventListener("pointerleave",release);
 btn.addEventListener("pointercancel",release);
});

// ================ CAR MOVEMENT ================

const TRACK_LENGTH=2*Math.PI*Math.sqrt(
 (TRACK_A*TRACK_A+TRACK_B*TRACK_B)/2
);

let steeringOffset=0;
let lastJumpState=false;

function updatePhysics(dt){

 if(!state.running||state.paused)return;

 // Acceleration
 if(keys.accelerate){
  state.speed+=85*dt;
 }else{
  state.speed-=22*dt;
 }

 // Brake
 if(keys.brake){
  state.speed-=110*dt;
 }

 // Nitro
 if(keys.nitro&&state.nitro>0&&state.speed>20){
  state.speed+=100*dt;
  state.nitro-=35*dt;
 }else{
  state.nitro+=12*dt;
 }

 state.nitro=Math.max(0,Math.min(100,state.nitro));
 state.speed=Math.max(0,Math.min(state.maxSpeed,state.speed));

 // Steering
 if(keys.left)steeringOffset-=12*dt;
 if(keys.right)steeringOffset+=12*dt;

 steeringOffset*=Math.pow(.92,dt*60);
 steeringOffset=Math.max(-7,Math.min(7,steeringOffset));

 // Jump
 if(keys.jump&&!lastJumpState){
  performJump();
 }

 lastJumpState=keys.jump;

 // Jump physics
 if(state.jumpY>0||state.jumpVelocity>0){
  state.jumpY+=state.jumpVelocity*dt;
  state.jumpVelocity-=25*dt;

  if(state.jumpY<0){
   state.jumpY=0;
   state.jumpVelocity=0;
   addPoints(50,"LANDING BONUS +50");
  }
 }

 // Move around track
 const movement=state.speed*dt;

 state.distance+=movement;
 totalRaceDistance+=movement;
 lapDistance+=movement;

 state.trackT+=movement/TRACK_LENGTH;

 // Update car position
 const track=trackPosition(state.trackT,steeringOffset);

 car.position.set(
  track.position.x,
  state.jumpY,
  track.position.z
 );

 car.rotation.y=Math.atan2(
  track.tangent.x,
  track.tangent.z
 );

 car.rotation.z=-steeringOffset*.025;

 // Wheel rotation
 wheels.forEach(w=>{
  w.rotation.x+=movement*.15;
 });

 // Check gameplay objects
 checkRamps();
 checkObstacles();
 checkLap();

 // Distance reward
 updateDistanceRewards();

 // UI
 document.getElementById("speed").innerHTML=
  Math.floor(state.speed)+" <span style='font-size:12px'>KM/H</span>";

 document.getElementById("distance").textContent=
  Math.floor(totalRaceDistance);

 document.getElementById("nitro").textContent=
  Math.floor(state.nitro);

 document.getElementById("lap").textContent=
  Math.min(state.lap,3);
}

// ================ CHASE CAMERA ================

function updateCamera(dt){

 const behind=new THREE.Vector3(
  -Math.sin(car.rotation.y)*13,
  6,
  -Math.cos(car.rotation.y)*13
 );

 const target=car.position.clone().add(behind);

 camera.position.lerp(target,Math.min(1,dt*4));

 const lookTarget=car.position.clone();
 lookTarget.y+=2;

 camera.lookAt(lookTarget);
}

// ================ RAIN ANIMATION ================

function updateRain(dt){

 const positions=rain.geometry.attributes.position.array;

 for(let i=0;i<rainCount;i++){
  positions[i*3+1]-=35*dt;

  if(positions[i*3+1]<0){
   positions[i*3+1]=45;
  }
 }

 rain.geometry.attributes.position.needsUpdate=true;

 rain.position.x=car.position.x;
 rain.position.z=car.position.z;
}

// ================ MUSIC SYSTEM ================

let audioContext=null;
let musicOn=false;
let musicTimer=null;

function playMusicNote(){

 if(!audioContext||!musicOn)return;

 const frequencies=[
  110,146.83,164.81,220,
  196,164.81,146.83,130.81
 ];

 const frequency=frequencies[
  Math.floor(Math.random()*frequencies.length)
 ];

 const osc=audioContext.createOscillator();
 const gain=audioContext.createGain();

 osc.type="sawtooth";
 osc.frequency.value=frequency;

 gain.gain.setValueAtTime(.025,audioContext.currentTime);
 gain.gain.exponentialRampToValueAtTime(
  .001,audioContext.currentTime+.22
 );

 osc.connect(gain);
 gain.connect(audioContext.destination);

 osc.start();
 osc.stop(audioContext.currentTime+.23);
}

function toggleMusic(){

 if(!audioContext){
  audioContext=new(window.AudioContext||window.webkitAudioContext)();
 }

 audioContext.resume();

 musicOn=!musicOn;

 document.getElementById("musicBtn").textContent=
  musicOn?"♫ MUSIC: ON":"♫ MUSIC: OFF";

 if(musicOn){
  if(musicTimer)clearInterval(musicTimer);

  musicTimer=setInterval(playMusicNote,250);
 }else{
  clearInterval(musicTimer);
  musicTimer=null;
 }
}

document.getElementById("musicBtn").onclick=toggleMusic;

// ================ GAME LOOP ================

function animate(){

 requestAnimationFrame(animate);

 const now=performance.now();

 const dt=Math.min((now-lastTime)/1000,.05);
 lastTime=now;

 if(state.running&&!state.paused){
  updatePhysics(dt);
  updateCamera(dt);
 }

 updateRain(dt);

 renderer.render(scene,camera);
}

// ================ RESIZE ================

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
});

// ================ START RENDERING ================

animate();

} // END OF startGame()

</script>
